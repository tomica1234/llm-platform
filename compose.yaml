services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: llm_platform
      POSTGRES_USER: llm_platform
      POSTGRES_PASSWORD: development-only
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U llm_platform"]
      interval: 5s
      timeout: 3s
      retries: 10
